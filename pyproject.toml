[project]
name = "secintel-mcp"
version = "0.0.1"
description = "MCP server for public vulnerability intelligence (NVD, OSV, FIRST EPSS, CISA KEV) with CVE patch prioritization"
readme = "README.md"
authors = [{ name = "Changhyun Kim" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "security", "cve", "vulnerability", "epss", "kev", "nvd", "osv"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.urls]
Repository = "https://github.com/zelopy/secintel-mcp"
Issues = "https://github.com/zelopy/secintel-mcp/issues"

[project.scripts]
secintel-mcp = "secintel_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
